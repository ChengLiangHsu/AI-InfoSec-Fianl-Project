name: drone-field

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: drone-field-app:${APP_IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/database.sqlite
      ODM_DIR: /data/odm
      NODEODM_URL: http://nodeodm:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      PYDANTIC_AI_MODEL: ${PYDANTIC_AI_MODEL:-google:gemini-3.7-flash}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      MAX_IMAGES: ${MAX_IMAGES:-100}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-26214400}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      MAX_ACTIVE_TASKS: ${MAX_ACTIVE_TASKS:-3}
      MAX_CHAT_REQUESTS_PER_DAY: ${MAX_CHAT_REQUESTS_PER_DAY:-100}
      ODM_MAX_CONCURRENCY: ${ODM_MAX_CONCURRENCY:-3}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      nodeodm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 4g
    logging: *logging

  nodeodm:
    image: opendronemap/nodeodm:3.6.2
    restart: unless-stopped
    command: ["--port", "3000", "--parallel_queue_processing", "1", "--cleanup_tasks_after", "129600"]
    volumes:
      - nodeodm_data:/var/www/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/info',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    cpus: 3
    mem_limit: 24g
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  app_data:
  nodeodm_data:
  caddy_data:
  caddy_config:
